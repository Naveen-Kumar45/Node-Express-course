<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Register</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= Navigation ================= -->

    <nav class="navbar">
        <h2 class="logo">Users App</h2>

        <div class="nav-buttons">
            <a href="index.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </div>
    </nav>

    <!-- ================= Register Form ================= -->

    <div class="container">

        <form id="registerForm" class="form">
            <h1>Create Account</h1>

            <!-- Username -->
            <div class="input-group">
                <input type="text" id="registerUsername" placeholder="Username" minlength="8" maxlength="30">
            </div>

            <div class="input-group">
                <input type="text" id="registerEmail" placeholder="Email" >
            </div>

            <!-- Password -->
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" minlength="8">
                <i class="fa-solid fa-eye" id="togglePassword"></i>
            </div>

            <!-- Role -->
            <div class="input-group">
                <label for="registerRole">Role</label>
                
                <select id="registerRole">
                    <option value="" disabled selected> Select a role</option>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            
            <!-- Register Button -->
            <button type="submit">Register</button>

            <!-- Message Container -->
            <div id="registerMsg" class="message"></div>
        </form>

    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
