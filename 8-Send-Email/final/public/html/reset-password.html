<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/password.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <div class="card__content">
          <div class="brand">
            <div class="brand__icon">↗</div>
            <span>AuthHub</span>
          </div>
          <h1>Create a new password</h1>
          <p>Enter your new password and confirm it to complete the reset process.</p>

          <form>
            <div class="form-group">
              <label for="newpassword">New password</label>
              <input id="newpassword" name="newpassword" type="password" placeholder="Enter your new password" required />
            </div>

            <div class="form-group">
              <label for="confirmpassword">Confirm password</label>
              <input id="confirmpassword" name="confirmpassword" type="password" placeholder="Confirm your new password" required />
            </div>

            <button type="submit">Update password</button>
          </form>

          <div class="switch">
            Remembered your password?
            <a href="/html/login.html">Back to sign in</a>
          </div>
        </div>
      </div>
    </div>
    <script src="/scripts/reset-password.js"></script>
  </body>
</html>
