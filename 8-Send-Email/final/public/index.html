<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/register.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <div class="card__content">
          <div class="brand">
            <div class="brand__icon">↗</div>
            <span>AuthHub</span>
          </div>
          <h1>Create your account</h1>
          <p>Join our community and start your journey today.</p>

          <form>
            <div class="form-group">
              <label for="name">Full name</label>
              <input id="name" name="name" type="text" placeholder="Maximus"  />
            </div>

            <div class="form-group">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" placeholder="you@example.com" />
            </div>

            <div class="form-group password-field">
              <label for="password">Password</label>
              <div class="password-input-wrapper">
                <input id="password" name="password" type="password" placeholder="Create a strong password" />
                <i class="fa-solid fa-eye" id="togglePassword"></i>
              </div>
            </div>

            <div class="form-group">
              <label for="contact">Contact number</label>
              <input id="contact" name="contact" type="tel"  value="+91 " />
            </div>

            <button type="submit">Create account</button>
          </form>

          <div class="switch">
            Already have an account?
            <a href="/html/login.html">Sign in</a>
          </div>

          <div class="message-container" id="message-container" hidden>
            <p class="message-text" id="message-text"></p>
          </div>
        </div>
      </div>
    </div>
    <script src="/scripts/messages.js"></script>
    <script src="/scripts/password-toggle.js"></script>
    <script src="/scripts/register.js"></script>
  </body>
</html>
